# Fichier de configuration VERSIONNE des checklists documentaires metier.
# Editable directement par l'etude (ajout/retrait de pieces, alias de fichiers, etc.).
# Genere initialement par scripts/_gen_document_checklists.py ; ce script peut servir de
# base pour une regeneration complete, mais n'est pas necessaire pour des ajustements ponctuels.
#
# Ce fichier NE constitue PAS une liste legale universelle. Les checklists doivent etre
# revues et adaptees par l'etude notariale. La presence d'un fichier ne vaut jamais
# validation juridique : la validite, l'actualite, les signatures, les originaux et la
# conformite des pieces doivent toujours etre verifiees par le notaire.

version: 1
source: checklist_configuree_etude
note: 'Checklists documentaires configurables par l''etude notariale. Cette configuration n''est pas une
  liste legale universelle : elle doit etre revue et validee par l''etude, et ne dispense jamais le notaire
  de sa propre verification juridique.'
checklists:
